name: Compile LaTeX Thesis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-bibtex-extra texlive-science biber

      - name: Compile Thesis (main.tex)
        working-directory: ./btu-wireless-thesis-template
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          biber main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Compile Standalone Affidavit (declaration_standalone.tex)
        working-directory: ./btu-wireless-thesis-template
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error declaration_standalone.tex

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-thesis-pdfs
          path: |
            btu-wireless-thesis-template/main.pdf
            btu-wireless-thesis-template/declaration_standalone.pdf
          retention-days: 30
